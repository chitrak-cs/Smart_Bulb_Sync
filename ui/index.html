<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wipro Lights</title>
<link rel="icon" href="/icon.svg">
<style>
:root{
  --bg:#0a0a12; --panel:#13131f; --panel2:#1a1a2a; --line:#262638; --text:#ecebf7; --mute:#8b8aa5;
  --accent:#8b7bff; --accent2:#ff5fa2; --ok:#3fdca4; --bad:#ff6b81; --c:#8b7bff;
  --r:16px; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%}
body{background:radial-gradient(1200px 600px at 15% -10%, #1c1840 0%, transparent 60%), var(--bg)}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:18px 28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:.2px}
.brand img{width:34px;height:34px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px}
.seg button{background:none;border:0;padding:8px 16px;border-radius:99px;cursor:pointer;color:var(--mute);font-weight:600;font-size:14px}
.seg button:hover{color:var(--text)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(139,123,255,.35)}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:22px;padding:6px 28px 36px;max-width:1280px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr;padding:6px 16px 28px} header{padding:16px}}
.card{background:linear-gradient(180deg,var(--panel),#101019);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero{display:flex;flex-direction:column;align-items:center;gap:18px;position:sticky;top:12px;align-self:start}
.stage{position:relative;width:230px;height:230px;display:grid;place-items:center}
.orb{width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff9 0%, transparent 38%), var(--c);
  box-shadow:0 0 70px 18px var(--c), inset 0 -18px 40px #0006;transition:background .25s,box-shadow .25s}
.orb.off{box-shadow:none;background:radial-gradient(circle at 35% 30%,#fff2,transparent 40%),#20202e}
.base{position:absolute;bottom:2px;width:70px;height:26px;border-radius:6px 6px 14px 14px;background:linear-gradient(#3a3a4d,#23232f)}
.np{width:100%;text-align:center}
.np .title{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .artist{color:var(--mute);margin-top:2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#ffffff12;color:var(--mute)}
.tag.learn{background:#ffb84d22;color:#ffc46b}.tag.replay{background:#3fdca422;color:var(--ok)}.tag.live{background:#8b7bff22;color:#b2a7ff}
.bar{height:6px;border-radius:99px;background:#ffffff14;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s}
.lv{display:flex;gap:10px;width:100%;height:64px;align-items:flex-end}
.lv div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--mute)}
.lv i{display:block;width:100%;border-radius:6px;background:linear-gradient(0deg,var(--accent),var(--accent2));transition:height .12s;min-height:3px}
.row{display:flex;align-items:center;gap:12px}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
label.small{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.tabs button.on{color:var(--text);border-color:var(--accent);background:#8b7bff1c}
h3{margin:0 0 4px;font-size:15px} .sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.preset{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;text-align:left;transition:transform .12s,border-color .12s}
.preset:hover{transform:translateY(-2px);border-color:#44445f}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 8px 24px rgba(139,123,255,.22)}
.preset .sw{height:34px;border-radius:9px;margin-bottom:10px}
.preset b{display:block;font-size:15px}.preset span{font-size:12px;color:var(--mute)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:14px}
.sl .n{font-size:14px;font-weight:600}.sl .h{grid-column:1;font-size:12px;color:var(--mute)}
.sl .v{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.sl .v a{color:var(--accent);cursor:pointer;margin-left:8px}
.sl input[type=range]{grid-column:1/3;margin-top:6px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:#ffffff1c;outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
input[type=range].hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
input[type=range].tmp{background:linear-gradient(90deg,#ffb15a,#fff,#9cc8ff)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--text)}
.btn:hover{border-color:#4a4a68}.btn.danger{color:var(--bad)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}
select,input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--accent)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 32px}
.song{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.song .top{display:flex;align-items:center;gap:12px;cursor:pointer}
.song .meta{flex:1;min-width:0}.song .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .meta span{font-size:12px;color:var(--mute)}
.song .pct{font-size:12px;color:var(--ok);font-weight:700;min-width:44px;text-align:right}
.song .body{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid #0006;cursor:pointer}
.log{font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);background:#0b0b14;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:200px;overflow:auto;white-space:pre-wrap}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.toggle{display:flex;gap:10px;flex-wrap:wrap}
.field{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px;align-items:center;margin-bottom:14px}
.field>span{font-weight:600;font-size:14px}.field small{display:block;color:var(--mute);font-weight:400;font-size:12px}
@media(max-width:600px){.field{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/icon.svg" alt="">Wipro Lights</div>
  <span class="chip"><span class="dot" id="bulbdot"></span><span id="bulbtxt">connecting…</span></span>
  <div class="spacer"></div>
  <div class="seg" id="modes"></div>
</header>

<main>
  <aside class="card hero">
    <div class="stage"><div class="orb" id="orb"></div><div class="base"></div></div>
    <div class="np">
      <div class="title" id="title">Nothing playing</div>
      <div class="artist" id="artist">Play something in Spotify or any player</div>
      <span class="tag" id="tag">idle</span>
      <div class="bar" id="learnbar" style="display:none"><i id="learnfill"></i></div>
    </div>
    <div class="lv" id="levels">
      <div><i></i>bass</div><div><i></i>mid</div><div><i></i>treble</div>
    </div>
    <div class="row col" style="width:100%">
      <label class="small"><span>Master brightness</span><span id="mastertxt"></span></label>
      <input type="range" id="master" min="5" max="100" step="1">
    </div>
  </aside>

  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </section>
</main>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "X-Lights": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
const debounce = (fn, ms = 150) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

let META = null, ST = null, CFG = null, TRACKS = [], TAB = (location.hash.slice(1).split(":")[0]) || localStorage.getItem("tab") || "presets", OPEN = new Set();
const OPEN_FIRST = location.hash.endsWith(":open");   // #songs:open expands the first song (used for screenshots)
const MODE_LABELS = { auto: "Auto", live: "Live", static: "Colour", white: "White", off: "Off" };
const MODE_HINT = { auto: "Learns each new song, replays it perfectly next time", live: "Reacts to sound only, saves nothing",
  static: "One steady colour", white: "Plain white light", off: "Bulb off" };

// ---- colour helpers
function hsv2css(h, s, v, a = 1) {            // bulb units: h 0-360, s/v 0-1000
  s /= 1000; v /= 1000;
  const l = v * (1 - s / 2), sl = (l === 0 || l === 1) ? 0 : (v - l) / Math.min(l, 1 - l);
  return `hsla(${h}, ${Math.round(sl * 100)}%, ${Math.round(l * 100)}%, ${a})`;
}
function whiteCss(temp, bright) {              // temp 0 warm .. 1000 cool
  const t = temp / 1000, k = Math.max(.25, bright / 1000);
  const r = 255, g = Math.round(190 + 55 * t), b = Math.round(110 + 145 * t);
  return `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`;
}
function effective(songSettings) {            // mirrors config.Config.effective
  const p = META.presets, c = { ...META.defaults, ...p[CFG.preset].values, ...CFG.overrides };
  if (songSettings) {
    if (p[songSettings.preset]) Object.assign(c, p[songSettings.preset].values);
    for (const k of Object.keys(META.defaults)) if (k in songSettings) c[k] = songSettings[k];
  }
  return c;
}

// ---- header / hero
function renderModes() {
  const box = $("#modes");
  if (box.children.length === 0) {
    for (const m of META.modes) box.append(el("button", { "data-m": m, title: MODE_HINT[m],
      onclick: () => api("/api/config", { mode: m }).then(c => { CFG = c; paint(); }) }, MODE_LABELS[m]));
  }
  for (const b of box.children) b.classList.toggle("on", b.dataset.m === CFG.mode);
}

function paint() {
  if (!ST || !CFG) return;
  renderModes();
  const s = ST, orb = $("#orb");
  const bulbOk = s.bulb.ok;
  $("#bulbdot").className = "dot " + (bulbOk ? "ok" : "bad");
  $("#bulbtxt").textContent = bulbOk ? `Bulb connected · ${s.bulb.ip}` : `Bulb not answering · ${s.bulb.ip}`;

  // orb mirrors the real bulb
  let css = null;
  if (CFG.mode === "off") css = null;
  else if (CFG.mode === "white") css = whiteCss(CFG.white.temp, CFG.white.bright * CFG.master);
  else if (CFG.mode === "static") css = hsv2css(CFG.static.h, CFG.static.s, Math.max(120, CFG.static.v * CFG.master));
  else if (s.active && s.colour) css = hsv2css(s.colour[0], s.colour[1], Math.max(150, s.colour[2]));
  else if (CFG.idle === "white") css = whiteCss(CFG.white.temp, CFG.white.bright * CFG.master);
  else if (CFG.idle === "keep" && s.colour) css = hsv2css(s.colour[0], s.colour[1], Math.max(150, s.colour[2]));
  orb.classList.toggle("off", !css);
  if (css) document.documentElement.style.setProperty("--c", css);

  // now playing
  const t = s.track, np = s.playing;
  const tag = $("#tag"), bar = $("#learnbar");
  if (CFG.mode === "auto" || CFG.mode === "live") {
    $("#title").textContent = np && np.title ? np.title : "Nothing playing";
    $("#artist").textContent = np ? (np.artist || s.player || "") : "Play something in Spotify or any player";
    if (t) {
      tag.className = "tag " + (t.replay ? "replay" : "learn");
      tag.textContent = t.replay ? `Replaying saved lights · ${Math.round(t.coverage * 100)}%` : `Learning · ${Math.round(t.coverage * 100)}% known`;
      bar.style.display = ""; $("#learnfill").style.width = Math.round(t.coverage * 100) + "%";
    } else {
      bar.style.display = "none";
      tag.className = "tag " + (s.active ? "live" : ""); tag.textContent = s.active ? "Live sync" : "Waiting for music";
    }
  } else {
    $("#title").textContent = { static: "Steady colour", white: "White light", off: "Bulb off" }[CFG.mode];
    $("#artist").textContent = "Music sync paused"; bar.style.display = "none";
    tag.className = "tag"; tag.textContent = "manual";
  }
  const lv = $("#levels").querySelectorAll("i");
  s.levels.forEach((x, i) => lv[i].style.height = (s.active ? Math.round(x * 100) : 0) + "%");
  if (document.activeElement !== $("#master")) $("#master").value = Math.round(CFG.master * 100);
  $("#mastertxt").textContent = Math.round(CFG.master * 100) + "%";
}

// ---- reusable slider (value shown is the effective one; "reset" appears when overridden)
function slider(p, value, overridden, onChange, onReset) {
  const input = el("input", { type: "range", min: p.min, max: p.max, step: p.step, "data-key": p.key,
    class: p.key.startsWith("hue_m") ? "hue" : "" });
  input.value = value;
  const val = el("span", {}, fmt(value, p));
  const reset = el("a", { onclick: () => onReset(p.key), style: overridden ? "" : "display:none" }, "reset");
  const v = el("div", { class: "v" }, val, reset);
  input.addEventListener("input", () => { val.firstChild.textContent = fmt(input.value, p); reset.style.display = ""; });
  input.addEventListener("input", debounce(() => onChange(p.key, parseFloat(input.value))));
  return el("div", { class: "sl" }, el("div", { class: "n" }, p.label), v, el("div", { class: "h" }, p.hint), input);
}
const fmt = (v, p) => (p.step < 1 ? (+v).toFixed(p.step < 0.1 ? 2 : 1) : Math.round(v)) + (p.key.endsWith("_ms") ? " ms" : "");
function groupedSliders(values, overrides, onChange, onReset) {
  const groups = {};
  for (const p of META.params) (groups[p.group] ||= []).push(p);
  return el("div", { class: "groups" }, Object.entries(groups).map(([g, ps]) =>
    el("div", {}, el("h3", {}, g), el("p", { class: "sub" }, ""), ps.map(p =>
      slider(p, values[p.key], p.key in overrides, onChange, onReset)))));
}

// ---- tabs
const TABS = { presets: "Presets", tune: "Tune", songs: "Songs", manual: "Manual", settings: "Settings" };
function renderTabs() {
  const box = $("#tabs"); box.innerHTML = "";
  for (const [k, label] of Object.entries(TABS))
    box.append(el("button", { class: k === TAB ? "on" : "", onclick: () => { TAB = k; localStorage.setItem("tab", k); renderTabs(); renderPane(); } }, label));
}
function setCfg(patch) { return api("/api/config", patch).then(c => { CFG = c; paint(); return c; }); }

function renderPane() {
  const pane = $("#pane"); pane.innerHTML = "";
  ({ presets: paneP, tune: paneT, songs: paneS, manual: paneM, settings: paneC })[TAB](pane);
}

function paneP(pane) {
  pane.append(el("h3", {}, "Genre & mood presets"), el("p", { class: "sub" }, "Pick a look. It applies to every song unless you give a song its own preset."));
  const grid = el("div", { class: "grid" });
  for (const [id, p] of Object.entries(META.presets)) {
    grid.append(el("button", { class: "preset" + (CFG.preset === id ? " on" : ""),
      onclick: () => setCfg({ preset: id, clear_overrides: true }).then(renderPane) },
      el("div", { class: "sw", style: `background:linear-gradient(90deg,${p.swatch.join(",")})` }), el("b", {}, p.label), el("span", {}, p.desc)));
  }
  pane.append(grid);
}

function paneT(pane) {
  const n = Object.keys(CFG.overrides).length;
  pane.append(el("div", { class: "row" }, el("div", { style: "flex:1" }, el("h3", {}, "Fine-tune everything"),
    el("p", { class: "sub" }, `Starting from the “${META.presets[CFG.preset].label}” preset. ${n ? n + " tweak" + (n > 1 ? "s" : "") + " on top." : "No tweaks yet."}`)),
    n ? el("button", { class: "btn", onclick: () => setCfg({ clear_overrides: true }).then(renderPane) }, "Reset to preset") : ""));
  pane.append(groupedSliders(effective(), CFG.overrides,
    (k, v) => setCfg({ overrides: { [k]: v } }),
    k => setCfg({ overrides: { [k]: null } }).then(renderPane)));
}

function paneM(pane) {
  const hs = [["Red", 0], ["Orange", 25], ["Yellow", 55], ["Green", 120], ["Cyan", 180], ["Blue", 240], ["Purple", 280], ["Pink", 320]];
  pane.append(el("h3", {}, "Steady colour"), el("p", { class: "sub" }, "Choose a colour and switch the bulb to Colour mode."));
  const sw = el("div", { class: "swatches" });
  for (const [name, h] of hs) sw.append(el("button", { title: name, style: `background:${hsv2css(h, 1000, 1000)}`,
    onclick: () => setCfg({ mode: "static", static: { h, s: 1000 } }).then(renderPane) }));
  pane.append(sw);
  const mk = (label, key, min, max, cls, obj, get) => {
    const inp = el("input", { type: "range", min, max, class: cls }); inp.value = get;
    inp.addEventListener("input", debounce(() => setCfg({ mode: obj === "static" ? "static" : "white", [obj]: { [key]: +inp.value } })));
    return el("div", { class: "sl" }, el("div", { class: "n" }, label), el("div", {}), inp);
  };
  pane.append(mk("Hue", "h", 0, 360, "hue", "static", CFG.static.h), mk("Saturation", "s", 0, 1000, "", "static", CFG.static.s),
    mk("Brightness", "v", 10, 1000, "", "static", CFG.static.v));
  pane.append(el("h3", { style: "margin-top:22px" }, "White light"), el("p", { class: "sub" }, "Also used when the music stops, if “When music stops” is set to White."));
  pane.append(mk("Warm ↔ cool", "temp", 0, 1000, "tmp", "white", CFG.white.temp), mk("Brightness", "bright", 10, 1000, "", "white", CFG.white.bright));
  pane.append(el("div", { class: "toggle" }, el("button", { class: "btn", onclick: () => setCfg({ mode: "white" }) }, "Switch to white now"),
    el("button", { class: "btn", onclick: () => setCfg({ mode: "off" }) }, "Turn bulb off")));
}

async function paneS(pane) {
  TRACKS = (await api("/api/tracks")).sort((a, b) => b.learned - a.learned);   // best-learned first
  pane.innerHTML = "";
  pane.append(el("h3", {}, "Learned songs"), el("p", { class: "sub" }, "Every song you play is learned once. Give a song its own preset or tweaks, or forget it to learn again."));
  if (!TRACKS.length) { pane.append(el("div", { class: "empty" }, "No songs yet. Play something while the mode is Auto.")); return; }
  const q = el("input", { type: "text", placeholder: "Search songs…", style: "width:100%;margin-bottom:14px" });
  const list = el("div");
  const draw = () => {
    list.innerHTML = "";
    const f = q.value.toLowerCase();
    for (const t of TRACKS.filter(t => (t.title + " " + t.artist).toLowerCase().includes(f))) list.append(songCard(t));
  };
  if (OPEN_FIRST && !OPEN.size) OPEN.add(TRACKS[0].key);
  q.addEventListener("input", draw); pane.append(q, list); draw();
}
function songCard(t) {
  const open = OPEN.has(t.key);
  const mins = `${Math.floor(t.length / 60)}:${String(Math.round(t.length % 60)).padStart(2, "0")}`;
  const nOver = Object.keys(t.settings).length;
  const card = el("div", { class: "song" });
  const top = el("div", { class: "top", onclick: () => { open ? OPEN.delete(t.key) : OPEN.add(t.key); card.replaceWith(songCard(t)); } },
    el("div", { class: "meta" }, el("b", {}, t.title), el("span", {}, `${t.artist} · ${mins}${nOver ? " · customised" : ""}`)),
    el("div", { class: "pct" }, Math.round(t.learned * 100) + "%"), el("span", { style: "color:var(--mute)" }, open ? "▾" : "▸"));
  card.append(top);
  if (open) {
    const body = el("div", { class: "body" });
    const sel = el("select", { onchange: () => save({ preset: sel.value }) },
      el("option", { value: "" }, "Use the global preset"), Object.entries(META.presets).map(([id, p]) => el("option", { value: id }, p.label)));
    sel.value = t.settings.preset || "";
    const save = async (body_) => { t.settings = await api("/api/track", { key: t.key, ...body_ }); const n = songCard(t); card.replaceWith(n); };
    body.append(el("div", { class: "row", style: "margin-bottom:14px" }, el("span", { class: "n", style: "font-weight:600" }, "Preset for this song"), sel,
      el("div", { class: "spacer" }),
      nOver ? el("button", { class: "btn", onclick: () => save({ set: "reset", preset: "" }) }, "Reset song") : "",
      el("button", { class: "btn danger", onclick: async () => { if (confirm(`Forget “${t.title}”? It will be learned again next time you play it.`)) { await api("/api/forget", { key: t.key }); TRACKS = TRACKS.filter(x => x !== t); card.remove(); } } }, "Forget song")));
    body.append(groupedSliders(effective(t.settings), t.settings, (k, v) => api("/api/track", { key: t.key, set: { [k]: v } }).then(s => t.settings = s),
      k => save({ set: { [k]: null } })));
    card.append(body);
  }
  return card;
}

function paneC(pane) {
  const row = (name, hint, ctrl) => el("div", { class: "field" }, el("span", {}, name, el("small", {}, hint)), ctrl);
  const idle = el("select", { onchange: () => setCfg({ idle: idle.value }) },
    el("option", { value: "white" }, "Back to white light"), el("option", { value: "off" }, "Turn the bulb off"), el("option", { value: "keep" }, "Leave it as it is"));
  idle.value = CFG.idle;
  const src = el("select", { onchange: () => setCfg({ source: src.value }) },
    el("option", { value: "" }, "Any player (Spotify preferred)"), el("option", { value: "spotify" }, "Spotify only"),
    el("option", { value: "vlc" }, "VLC only"), el("option", { value: "firefox" }, "Firefox only"), el("option", { value: "chrome" }, "Chrome only"));
  src.value = CFG.source;
  const ip = el("input", { type: "text", value: CFG.bulb_ip, style: "width:160px" });
  const ipbtn = el("button", { class: "btn", onclick: () => setCfg({ bulb_ip: ip.value }).then(c => { ip.value = c.bulb_ip; }) }, "Save");
  pane.append(el("h3", {}, "Settings"), el("p", { class: "sub" }, "Changes apply instantly and are remembered."),
    row("When the music stops", "What the bulb does between songs and at rest", idle),
    row("Music source", "Which player the lights should follow", src),
    row("Bulb address", "Local IP of the bulb (give it a fixed address in your router)", el("div", { class: "row" }, ip, ipbtn)),
    el("h3", { style: "margin-top:22px" }, "Activity"), el("div", { class: "log", id: "log" }, ""));
  paintLog();
}
function paintLog() { const l = $("#log"); if (l && ST) { const atEnd = l.scrollTop + l.clientHeight >= l.scrollHeight - 8; l.textContent = ST.events.join("\n"); if (atEnd) l.scrollTop = l.scrollHeight; } }

// ---- boot
$("#master").addEventListener("input", debounce(() => setCfg({ master: $("#master").value / 100 })));
async function tick() {
  try { const r = await api("/api/state"); ST = r.status; const first = !CFG; CFG = r.config; if (first) renderPane(); paint(); paintLog(); }
  catch { $("#bulbdot").className = "dot bad"; $("#bulbtxt").textContent = "Service not running"; }
}
(async () => {
  META = await api("/api/meta"); await tick(); renderTabs(); renderPane();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
